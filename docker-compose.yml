services:
  db:
    image: pgvector/pgvector:pg16
    container_name: traumato_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: traumato
      POSTGRES_PASSWORD: traumato
      POSTGRES_DB: traumato
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traumato -d traumato"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traumato_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://traumato:traumato@db:5432/traumato
      - SECRET_KEY=traumato-tunisie-secret-key-jwt-2026-traumatologie-secure
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - PROJECT_NAME=TraumatoTN - Backend Médical Traumatologie
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: traumato_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:

